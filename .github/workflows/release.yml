name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: ./gradlew packageMsi --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: ./gradlew packageDmg --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: app/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: |
          chmod +x gradlew
          ./gradlew packageDeb --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
