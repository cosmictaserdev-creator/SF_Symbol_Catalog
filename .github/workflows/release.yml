name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: bash ./gradlew jvmTest packageMsi --no-daemon --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
      NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
      NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Build DMG
        run: bash ./gradlew jvmTest packageDmg --no-daemon --console=plain
        shell: bash
      - name: Notarize and staple DMG
        if: env.MACOS_CERTIFICATE != ''
        run: |
          bash ./gradlew notarizeDmg --no-daemon
          xcrun stapler staple app/build/compose/binaries/main/dmg/*.dmg
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: app/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: |
          chmod +x gradlew
          bash ./gradlew jvmTest packageDeb --no-daemon --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
